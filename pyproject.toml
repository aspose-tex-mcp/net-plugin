[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adcs-tex-net-extractor"
version = "0.1.0"
requires-python = ">=3.12"
description = "Aspose.TeX for .NET documentation and API extraction plugin"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
adcs-tex-net-extract = "adcs_tex_net.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
